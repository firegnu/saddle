# A capybara drawn as block glyphs on a 16x3 cell canvas. See README.md for the format.
# Original design for saddle, the block twin of capybara-image.toml: a barrel body, a raised
# boxy head with a small ear, a sleepy half-lidded eye and a broad snout. It faces right; saddle
# flips every pose when it walks left.
step_ticks = 6
mirror = true

[palette]
G = "#c08550"  # fur
N = "#5b3a26"  # nose
K = "#24160f"  # eyes
B = "#ec9c8c"  # cheeks
L = "#79b84a"  # leaf
O = "#f5a031"  # orange
C = "#9fd2f2"  # bird
Y = "#f3b23a"  # beak
Z = "#a59d8b"  # sleep

