[package]
name = "saddle-diff-plugin"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[[bin]]
name = "saddle-diff"
path = "src/main.rs"

[dependencies]
saddle-plugin-sdk = { path = "../../crates/plugin-sdk" }
anyhow = "1"
serde_json = "1"
similar = { version = "2.7", features = ["unicode"] }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
unicode-width = "0.2"
unicode-segmentation = "1"

[dev-dependencies]
tempfile = "3"
