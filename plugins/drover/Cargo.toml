[package]
name = "saddle-drover-plugin"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[[bin]]
name = "saddle-drover"
path = "src/main.rs"

[dependencies]
saddle-plugin-sdk = { path = "../../crates/plugin-sdk" }
anyhow = "1"
crossterm = "0.29"
libc = "0.2"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
unicode-width = "0.2"

regex = "1"
sha2 = "0.10"
tempfile = "3"
