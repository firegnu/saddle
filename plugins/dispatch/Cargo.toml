[package]
name = "saddle-dispatch-plugin"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[dependencies]
saddle-core-plugin = { path = "../../crates/core-plugin" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
