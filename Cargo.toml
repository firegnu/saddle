[package]
name = "saddle"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "A three-pane terminal workspace for corral agents and drover"

[dependencies]
anyhow = "1"
alacritty_terminal = "0.26"
crossterm = "0.29"
libc = "0.2"
portable-pty = "0.9"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
toml = "1"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
vt100 = "0.16"
