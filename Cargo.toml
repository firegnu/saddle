[workspace]
members = ["crates/plugin-protocol", "crates/plugin-sdk", "plugins/drover", "plugins/diff"]
default-members = [".", "crates/plugin-protocol", "crates/plugin-sdk", "plugins/drover", "plugins/diff"]
exclude = ["examples/counter-plugin", "examples/attention-plugin"]
resolver = "3"

[package]
name = "saddle"
default-run = "saddle"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "A three-pane terminal workspace for corral agents and drover"

[dependencies]
saddle-plugin-protocol = { path = "crates/plugin-protocol" }
saddle-plugin-sdk = { path = "crates/plugin-sdk" }
anyhow = "1"
alacritty_terminal = "0.26"
crossterm = "0.29"
libc = "0.2"
portable-pty = "0.9"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
shell-words = "1"
toml = "1"
unicode-width = "0.2"
arboard = { version = "3.6.1", default-features = false }

tempfile = "3"
toml_edit = "0.25"

[dev-dependencies]
saddle-drover-plugin = { path = "plugins/drover" }
vt100 = "0.16"
