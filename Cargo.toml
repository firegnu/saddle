[package]
name = "saddle"
default-run = "saddle"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "A terminal workspace for corral agents"

[dependencies]
anyhow = "1"
base64 = "0.22"
alacritty_terminal = "0.26"
crossterm = "0.29"
flate2 = "1"
libc = "0.2"
portable-pty = "0.9"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
shell-words = "1"
toml = "1"
unicode-width = "0.2"
arboard = { version = "3.6.1", default-features = false }

sha2 = "0.10"
tempfile = "3"
toml_edit = "0.25"

[dev-dependencies]
vt100 = "0.16"

# Native launcher for the timing-sensitive integration-test scripts.
[[bin]]
name = "saddle-test-script"
path = "tests/fixtures/script_runner.rs"
test = false
bench = false
