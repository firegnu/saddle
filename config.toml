# Copy to $XDG_CONFIG_HOME/saddle/config.toml when XDG_CONFIG_HOME is absolute,
# otherwise ~/.config/saddle/config.toml; or select with saddle --config PATH.
# All settings are optional. Omitted settings use the defaults shown here.
corral = "corral"              # Executable name or path; ~/ is supported.
left_width = 52               # Preferred left column width, in terminal cells.
left_split = 0.5              # Unused: Agents fill the left column. Kept so old configs load.
refresh_ms = 1000             # Background refresh interval, in milliseconds.
mascot_enabled = true        # Show the animated mascot beside terminal tabs.
mascot = "clawd"             # Which pet: "clawd" or "cat".
theme = "dune"               # dune | tide | lagoon | terminal; omitted = dune. Sets every color below.

# Optional tasks: install plugins/drover; legacy [queue] settings are ignored.

[colors]
# Optional per-color overrides on top of `theme`; an omitted color follows the theme.
# Uncomment only the colors you want to change. The values shown are Dune's.
# "default" (or "reset") uses the terminal's color; RGB uses "#RRGGBB".
# ANSI names: black, red, green, yellow, blue, magenta, cyan, gray,
# dark_gray, light_red, light_green, light_yellow, light_blue,
# light_magenta, light_cyan, white. Names are lowercase.
# Viewer terminal output keeps its own colors.
# bg = "default"               # Main surfaces.
# overlay = "default"          # Dialog surfaces.
# selected = "dark_gray"       # Project picker selection.
# agent_selected = "#2b2621"   # Selected agent background.
# border = "dark_gray"
# text = "default"
# bright = "white"
# muted = "gray"
# dim = "dark_gray"
# focus = "yellow"             # Active borders and primary controls.
# input_text = "black"         # Text on the focus-colored input target badge.
# connected = "cyan"           # Connection and repo markers.
# working = "blue"             # Agent instance/identity accent.
# danger = "red"               # Destructive actions and agent error details.
# unread = "magenta"

# Shared Agents / Queue status and Queue action-feedback colors.
# agent_working = "#7fb4ee"    # Tasks: Current heading, Running.
# agent_idle = "#9cbd80"       # Tasks: Done.
# agent_blocked = "#e6b566"    # Tasks: Awaiting heading and status.
# agent_stalled = "#e79b65"    # Tasks: Dropped.
# agent_error = "#ef8174"      # Tasks: Failed.
# agent_starting = "#b0a1d8"   # Tasks: Pending heading and status.

# Agents panel palette (the Agents column only; Tasks keeps the shared colors above).
# Without COLORTERM=truecolor/24bit, RGB values here use the nearest 256-color entry.
# agents_bg = "#1d1a16"
# agents_border = "#5a5247"    # Unfocused border; focus still uses `focus`.
# agents_rule = "#3a352e"      # Header and bottom-bar rules.
# agents_faint = "#3d3830"     # Entry gutters, group lines, exited agents, ↑0.
# agents_text = "#e8dfcc"
# agents_branch = "#cfc6b2"
# agents_dim = "#8c8374"       # Paths, upstream names, durations.
# agents_dimmer = "#756c5e"    # Instance / ATT / VIA line, disabled controls.
# agents_accent = "#bdb86a"    # Group names, selected gutter, control keys.
# agents_green = "#a8c47c"     # idle, +lines, ATT > 0, this saddle's ⦿.
# agents_red = "#e37264"       # error, -lines, Stop.
# agents_blue = "#7fa9ea"      # working.
# agents_yellow = "#d9b25f"    # waiting, ↑n > 0.
# agents_purple = "#a58bdc"    # working spinner.

# Agent type accents.
# claude = "#e2835e"
# codex = "#79d4b4"
# pi = "#ffffff"
# omp = "#a855f7"

# Formatting in retained reply/detail rendering paths.
# reply_code = "yellow"
# reply_heading = "cyan"
